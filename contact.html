                        <!-- Contact links -->

            <div class="row text-center mb-5">

            <section class="bg-light py-5">
  <div class="container px-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-xl-7">
        
        <!-- Main Card Wrapper -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
          <div class="card-body p-4 p-sm-5">

            <!-- Title & Subtitle -->
            <div class="text-center mb-4">
              <h3 class="display-8 fw-bolder mb-0"><span class="text-gradient d-inline">Get In Touch</span></h3>
              <p class="text-muted fs-6 mb-0">Let's work together!</p>
            </div>

            <!-- Contact Icons (Tightly Spaced) -->
            <div class="d-flex justify-content-center gap-4 mb-4 pb-2 text-center">
              
              <!-- LinkedIn -->
              <a href="https://www.linkedin.com/in/arran-farrell-49978212b/" target="_blank" class="text-decoration-none contact-icon-item">
                <div class="feature bg-primary bg-gradient text-white rounded-3 mb-1 mx-auto">
                  <i class="bi bi-linkedin fs-5"></i>
                </div>
                <span class="fw-semibold text-dark small">LinkedIn</span>
              </a>

              <!-- Email -->
              <a href="mailto:arran.farrell1423@gmail.com" class="text-decoration-none contact-icon-item">
                <div class="feature bg-primary bg-gradient text-white rounded-3 mb-1 mx-auto">
                  <i class="bi bi-envelope-fill fs-5"></i>
                </div>
                <span class="fw-semibold text-dark small">Email</span>
              </a>

              <!-- GitHub -->
              <a href="https://github.com/ArranF1995" target="_blank" class="text-decoration-none contact-icon-item">
                <div class="feature bg-primary bg-gradient text-white rounded-3 mb-1 mx-auto">
                  <i class="bi bi-github fs-5"></i>
                </div>
                <span class="fw-semibold text-dark small">GitHub</span>
              </a>

              <!-- Phone -->
              <a href="tel:+353863453771" class="text-decoration-none contact-icon-item">
                <div class="feature bg-primary bg-gradient text-white rounded-3 mb-1 mx-auto">
                  <i class="bi bi-telephone-fill fs-5"></i>
                </div>
                <span class="fw-semibold text-dark small">Phone</span>
              </a>

            </div>

            <hr class="my-4 text-muted opacity-25">

            <!-- Contact Form -->
            <form id="contactForm">
              
              <!-- Full Name -->
              <div class="form-floating mb-3">
                <input class="form-control" id="name" type="text" placeholder="Enter your name..." required />
                <label for="name">Full name</label>
              </div>

              <!-- Email Address -->
              <div class="form-floating mb-3">
                <input class="form-control" id="email" type="email" placeholder="name@example.com" required />
                <label for="email">Email address</label>
              </div>

              <!-- Phone Number -->
              <div class="form-floating mb-3">
                <input class="form-control" id="phone" type="tel" placeholder="(123) 456-7890" required />
                <label for="phone">Phone number</label>
              </div>

              <!-- Message -->
              <div class="form-floating mb-3">
                <textarea class="form-control" id="message" type="text" placeholder="Enter your message here..." style="height: 10rem" required></textarea>
                <label for="message">Message</label>
              </div>

              <!-- Submit Button -->
              <div class="d-grid">
                <button class="btn btn-primary btn-lg" id="submitButton" type="submit">Submit</button>
              </div>

            </form>

          </div>
        </div>

      </div>
